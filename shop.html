

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | Velora Fashion</title>
  <style>
    :root {
      --bg-color: #fcfbf9;
      --primary-color: #1a1a1a;
      --accent-color: #c5a059;
      --font-heading: 'Playfair Display', Georgia, serif;
      --font-body: 'Montserrat', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--primary-color);
      font-family: var(--font-body);
    }

    /* Header & Aligned Navigation */
    header {
      position: sticky;
      top: 0;
      background: rgba(252, 251, 249, 0.98);
      backdrop-filter: blur(8px);
      z-index: 1000;
      border-bottom: 1px solid #eaeaea;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 2rem;
      height: 80px;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--primary-color);
      height: 100%;
    }

    .brand-logo img {
      height: 52px;
      width: auto;
      object-fit: contain;
      border-radius: 50%;
      transition: transform 0.3s ease;
    }

    .brand-logo:hover img {
      transform: scale(1.05);
    }

    .brand-logo .brand-text {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 700;
      line-height: 1;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 2.5rem;
      align-items: center;
      height: 100%;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--primary-color);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 500;
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--accent-color);
    }

    /* Shop Content */
    .shop-container {
      max-width: 1200px;
      margin: 3rem auto;
      padding: 0 2rem;
    }

    .page-title {
      font-family: var(--font-heading);
      font-size: 2.5rem;
      text-align: center;
      margin-bottom: 2rem;
    }

    /* Filter Buttons */
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .filter-btn {
      background: none;
      border: none;
      font-family: var(--font-body);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      padding: 0.5rem 1rem;
      color: var(--primary-color);
      transition: all 0.3s ease;
    }

    .filter-btn.active, .filter-btn:hover {
      color: var(--accent-color);
      border-bottom: 1px solid var(--accent-color);
    }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 2.5rem;
    }

    .product-card {
      display: flex;
      flex-direction: column;
    }

    .product-image {
      width: 100%;
      height: 380px;
      object-fit: cover;
      margin-bottom: 1rem;
    }

    .product-title {
      font-family: var(--font-heading);
      font-size: 1.1rem;
      margin-bottom: 0.3rem;
    }

    .product-price {
      font-size: 0.9rem;
      color: #666;
    }

    /* Footer */
    footer {
      background-color: var(--primary-color);
      color: #ffffff;
      text-align: center;
      padding: 3rem 1rem;
      margin-top: 5rem;
    }

    footer p {
      font-size: 0.85rem;
      color: #999999;
      letter-spacing: 1px;
    }

    @media (max-width: 768px) {
      .nav-container {
        padding: 0.8rem 1rem;
      }
      .brand-logo img {
        height: 42px;
      }
      .brand-logo .brand-text {
        font-size: 1.2rem;
      }
      .nav-links {
        gap: 1.2rem;
      }
      .nav-links a {
        font-size: 0.75rem;
      }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <img src="v2.png" alt="Velora Fashion Emblem">
        <span class="brand-text">Velora</span>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="shop.html" class="active">Shop</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="shop-container">
    <h1 class="page-title">The Collection</h1>
    
    <div class="filter-bar">
      <button class="filter-btn active" data-category="all">All</button>
      <button class="filter-btn" data-category="dresses">Dresses</button>
      <button class="filter-btn" data-category="suits">Suits</button>
      <button class="filter-btn" data-category="knitwear">Knitwear</button>
    </div>

    <div class="product-grid" id="productGrid">
      <div class="product-card" data-category="dresses">
        <img class="product-image" src="https://images.unsplash.com/photo-1595777457583-95e059d581b8?q=80&w=600" alt="Silk Midi Dress">
        <h3 class="product-title">Silk Evening Gown</h3>
        <p class="product-price">\$480.00</p>
      </div>
      <div class="product-card" data-category="suits">
        <img class="product-image" src="https://images.unsplash.com/photo-1548624149-f1e1f2f012b1?q=80&w=600" alt="Wool Blazer">
        <h3 class="product-title">Tailored Wool Blazer</h3>
        <p class="product-price">\$350.00</p>
      </div>
      <div class="product-card" data-category="knitwear">
        <img class="product-image" src="https://images.unsplash.com/photo-1576995853123-5a10305d93c0?q=80&w=600" alt="Cashmere Sweater">
        <h3 class="product-title">Cashmere Rollneck Sweater</h3>
        <p class="product-price">\$290.00</p>
      </div>
      <div class="product-card" data-category="dresses">
        <img class="product-image" src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?q=80&w=600" alt="Cocktail Dress">
        <h3 class="product-title">Satin Cocktail Dress</h3>
        <p class="product-price">\$420.00</p>
      </div>
      <div class="product-card" data-category="suits">
        <img class="product-image" src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=600" alt="Wide-Leg Trousers">
        <h3 class="product-title">High-Waisted Trousers</h3>
        <p class="product-price">\$210.00</p>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> VELORA FASHION. ALL RIGHTS RESERVED.</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('year').textContent = new Date().getFullYear();

      const filterButtons = document.querySelectorAll('.filter-btn');
      const productCards = document.querySelectorAll('.product-card');

      filterButtons.forEach(button => {
        button.addEventListener('click', () => {
          filterButtons.forEach(btn => btn.classList.remove('active'));
          button.classList.add('active');

          const category = button.getAttribute('data-category');

          productCards.forEach(card => {
            if (category === 'all' || card.getAttribute('data-category') === category) {
              card.style.display = 'flex';
            } else {
              card.style.display = 'none';
            }
          });
        });
      });
    });
  </script>
</body>
</html>
