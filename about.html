<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Us | Velora Fashion</title>
  <style>
    :root {
      --bg-color: #fcfbf9;
      --primary-color: #1a1a1a;
      --accent-color: #c5a059;
      --font-heading: 'Playfair Display', Georgia, serif;
      --font-body: 'Montserrat', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--primary-color);
      font-family: var(--font-body);
      line-height: 1.8;
    }

    /* Header & Aligned Navigation */
    header {
      position: sticky;
      top: 0;
      background: rgba(252, 251, 249, 0.98);
      backdrop-filter: blur(8px);
      z-index: 1000;
      border-bottom: 1px solid #eaeaea;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 2rem;
      height: 80px;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--primary-color);
      height: 100%;
    }

    .brand-logo img {
      height: 52px;
      width: auto;
      object-fit: contain;
      border-radius: 50%;
      transition: transform 0.3s ease;
    }

    .brand-logo:hover img {
      transform: scale(1.05);
    }

    .brand-logo .brand-text {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 700;
      line-height: 1;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 2.5rem;
      align-items: center;
      height: 100%;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--primary-color);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 500;
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--accent-color);
    }

    /* About Section */
    .about-container {
      max-width: 1000px;
      margin: 4rem auto;
      padding: 0 2rem;
    }

    .about-title {
      font-family: var(--font-heading);
      font-size: 2.5rem;
      text-align: center;
      margin-bottom: 3rem;
    }

    .about-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      align-items: center;
    }

    .about-text p {
      margin-bottom: 1.5rem;
      color: #444;
      font-weight: 300;
    }

    .about-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Footer */
    footer {
      background-color: var(--primary-color);
      color: #ffffff;
      text-align: center;
      padding: 3rem 1rem;
      margin-top: 5rem;
    }

    footer p {
      font-size: 0.85rem;
      color: #999999;
      letter-spacing: 1px;
    }

    @media (max-width: 768px) {
      .nav-container {
        padding: 0.8rem 1rem;
      }
      .brand-logo img {
        height: 42px;
      }
      .brand-logo .brand-text {
        font-size: 1.2rem;
      }
      .nav-links {
        gap: 1.2rem;
      }
      .nav-links a {
        font-size: 0.75rem;
      }
      .about-content {
        grid-template-columns: 1fr;
      }
    }
  </style>
